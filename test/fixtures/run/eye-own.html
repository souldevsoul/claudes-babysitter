<!doctype html><html><body><main><h1>x</h1><form><div class="grid" style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
<div><label for="a">Password</label><div style="position:relative"><input id="a" type="password"><button type="button" aria-label="Show password" tabindex="-1">eye</button></div></div>
<div><label for="b">Confirm password</label><div style="position:relative"><input id="b" type="password"><button type="button" aria-label="Show password" tabindex="-1">eye</button></div></div>
</div></form>
