<!doctype html><meta charset="utf-8"><title>1.4 hover</title>
<!-- 1.4: gradient CTA, translucent pill over a SIBLING dark hero, disabled control: no failure.
     White label on a white button and on a pale gradient: real failures. -->
<body style="margin:0;background:#fff;font:16px/1.4 sans-serif">
<section style="position:relative;height:160px">
  <div style="position:absolute;inset:0;background:#0b1020;pointer-events:none"></div>
  <div style="position:relative;padding:24px">
    <a id="pill" role="button" href="#" style="display:inline-block;padding:10px 16px;background:rgba(255,255,255,.1);color:#fff;border-radius:999px;text-decoration:none">Pill on the hero</a>
  </div>
</section>
<p style="padding:16px">
  <button id="grad" style="padding:12px 20px;border:0;color:#fff;background-image:linear-gradient(to right,#2563eb,#7c3aed)">Gradient CTA</button>
  <button id="dis" disabled style="padding:12px 20px;border:1px solid #eee;color:#fff;background:#fff">Disabled white</button>
  <span aria-disabled="true"><button id="dis2" style="padding:12px 20px;border:1px solid #eee;color:#fff;background:#fff">Inside aria-disabled</button></span>
  <button id="bad" style="padding:12px 20px;border:1px solid #ddd;color:#fff;background:transparent">White on white</button>
  <button id="badgrad" style="padding:12px 20px;border:1px solid #ddd;color:#fff;background-image:linear-gradient(#fff,#f3f4f6)">Pale gradient</button>
</p>
</body>
<div style="height:1200px"></div>
<p style="padding:16px"><button id="under" style="padding:12px 20px;border:0;color:#fff;background-image:linear-gradient(to right,#2563eb,#7c3aed)">Under the banner</button></p>
<div id="banner" style="position:fixed;left:0;right:0;bottom:0;height:70%;background:#fff;border-top:1px solid #ccc">We use cookies</div>
