<!doctype html><meta charset="utf-8"><title>1.18 checked</title>
<!-- 1.18: a tick box whose checked style only moves the border colour (Vertex) and one where nothing changes fail;
     a filled box, the system box, a peer-checked label box, a radio with a dot and a switch whose thumb moves pass. -->
<style>
  body{margin:0;font:16px sans-serif;padding:24px}
  .box{appearance:none;width:18px;height:18px;border:2px solid #999;border-radius:4px;margin:0;vertical-align:middle}
  .broken:checked{border-color:#2563eb}
  .good:checked{background:#2563eb;border-color:#2563eb}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
  .pbox{display:inline-block;width:16px;height:16px;border:2px solid #999;vertical-align:middle}
  #p1:checked + .pbox{background:#2563eb}
  #p2:checked + .pbox2{border-color:#2563eb}
  .pbox2{display:inline-block;width:16px;height:16px;border:2px solid #999;vertical-align:middle}
  .rad{appearance:none;width:18px;height:18px;border:2px solid #999;border-radius:50%;margin:0}
  .rad:checked{background:radial-gradient(#2563eb 40%,transparent 45%)}
  .sw{width:44px;height:24px;border-radius:12px;background:#ccc;border:0;position:relative;padding:0}
  .sw span{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .1s}
  .sw[aria-checked=true] span{transform:translateX(20px)}
  p{margin:12px 0}
</style>
<body>
<p><label><input type="checkbox" id="broken" class="box broken"> Border only</label></p>
<p><label><input type="checkbox" id="nothing" class="box nothing"> Nothing</label></p>
<p><label><input type="checkbox" id="good" class="box good"> Filled</label></p>
<p><label><input type="checkbox" id="native"> System</label></p>
<p><label class="peer1"><input type="checkbox" id="p1" class="sr-only"><span class="pbox"></span> Peer filled</label></p>
<p><label class="peer2"><input type="checkbox" id="p2" class="sr-only"><span class="pbox2"></span> Peer border only</label></p>
<p><label><input type="radio" name="r" id="r1" class="rad" checked> One</label> <label><input type="radio" name="r" id="r2" class="rad"> Two</label></p>
<p><button role="switch" aria-checked="false" aria-label="Notifications" class="sw" id="sw" onclick="this.setAttribute('aria-checked', this.getAttribute('aria-checked') === 'true' ? 'false' : 'true')"><span></span></button></p>
<p><input type="checkbox" id="off" class="box broken" disabled> <label for="off">Disabled</label></p>
</body>
<div style="height:1200px"></div>
<p><label><input type="checkbox" id="covered" class="box good covered"> Under the banner</label></p>
<div style="position:fixed;left:0;right:0;bottom:0;height:60%;background:#fff;border-top:1px solid #ccc">We use cookies</div>
