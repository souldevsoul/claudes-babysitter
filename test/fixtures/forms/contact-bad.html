<!doctype html><html><body><main><h1>Contact</h1>
<form id="c"><label for="n">Name</label><input id="n" name="name">
<label for="e">Email</label><input id="e" name="email" type="email">
<label for="s">Subject</label><input id="s" name="subject">
<label for="m">Message</label><textarea id="m" name="message"></textarea>
<button type="submit">Send message</button><p id="st" role="status"></p></form>
<script>document.getElementById('c').addEventListener('submit', async (e) => { e.preventDefault();
const r = await fetch('/api/contact', { method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify(Object.fromEntries(new FormData(e.target))) });
document.getElementById('st').textContent = r.ok ? 'Message sent. We will get back to you.' : 'Could not send the message. Try again.'; });</script>
</main></body></html>
