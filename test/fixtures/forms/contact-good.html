<!doctype html><html><body><main><h1>Contact</h1>
<form id="c" novalidate><label for="n">Name</label><input id="n" name="name"><p id="en"></p>
<label for="e">Email</label><input id="e" name="email" type="email">
<label for="s">Subject</label><input id="s" name="subject"><p id="es"></p>
<label for="m">Message</label><textarea id="m" name="message"></textarea><p id="em"></p>
<button type="submit">Send message</button><p id="st" role="status"></p></form>
<script>document.getElementById('c').addEventListener('submit', async (e) => { e.preventDefault(); const f = e.target; let bad = false;
const chk = (el, min, out, msg) => { const ok = el.value.trim().length >= min && !/^(.)\1+$/.test(el.value.trim()); document.getElementById(out).textContent = ok ? '' : msg; el.setAttribute('aria-invalid', String(!ok)); if (!ok) bad = true; };
chk(f.name, 2, 'en', 'Name must be at least 2 letters'); chk(f.subject, 3, 'es', 'Subject must be at least 3 characters'); chk(f.message, 10, 'em', 'Message must be at least 10 characters');
if (bad) return;
const r = await fetch('/api/contact', { method: 'POST', body: JSON.stringify(Object.fromEntries(new FormData(f))) });
document.getElementById('st').textContent = r.ok ? 'Message sent. We will get back to you.' : 'Could not send the message. Try again.'; });</script>
</main></body></html>
